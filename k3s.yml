---
- name: Install K3s on UAT server
  hosts: uat
  vars:
    k3s_url: https://get.k3s.io

  tasks:
    # pipefail matters here: `curl -sfL ... | sh` returns the exit code of `sh`,
    # so a failed download would still report success. With pipefail the
    # pipeline fails if curl fails.
    - name: Install K3s (latest stable)
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL {{ k3s_url }} | sh -
      args:
        creates: /usr/local/bin/k3s
      notify: Wait for node ready

    - name: Read the kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Get node status
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Print node info
      ansible.builtin.debug:
        var: nodes.stdout_lines

  handlers:
    # Runs only when the install task actually changed. `kubectl wait` only
    # blocks and reports no change, so changed_when is false.
    - name: Wait for node ready
      ansible.builtin.command:
        cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
      changed_when: false
