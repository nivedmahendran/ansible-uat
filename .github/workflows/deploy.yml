name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install yamllint ansible-lint --user
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint YAML
        run: yamllint k8s/ deploy.yml docker.yml k3s.yml certmanager.yml argocd.yml

      - name: Lint Ansible
        run: ansible-lint deploy.yml docker.yml k3s.yml certmanager.yml argocd.yml

      # `kubectl apply --dry-run=client` still contacts the API server to fetch
      # OpenAPI schemas, so it fails with "connection refused" on a runner with
      # no cluster — for every manifest, regardless of whether it is valid.
      # kubeconform validates offline against published schemas, including the
      # cert-manager ClusterIssuer, so it is both correct and stricter here.
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate K8s manifests
        run: |
          kubeconform -summary -strict \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan K8s manifests with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: k8s/
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Scan Dockerfile with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: app/Dockerfile
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Scan Helm chart with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: helm-chart/
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  deploy:
    name: Deploy to UAT
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # A job-level `if` cannot read secrets, so the check runs as a step and
      # every later step is gated on its output.
      #
      # The point is that a missing or stale UAT_HOST should mean "there is no
      # server configured right now", not "the build is broken". Lint and
      # security results are what this pipeline exists to report; a red deploy
      # job for an absent dev server trains you to ignore the pipeline.
      - name: Check whether a UAT server is configured
        id: preflight
        env:
          UAT_HOST: ${{ secrets.UAT_HOST }}
        run: |
          if [[ -z "$UAT_HOST" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UAT_HOST is not set; skipping deploy. Configure the secret to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "UAT_HOST is set; proceeding."
          fi

      - name: Install Ansible
        if: steps.preflight.outputs.configured == 'true'
        run: |
          pip install ansible --user
          sudo apt update -qq
          sudo apt install -y -qq rsync
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # The server may be deprovisioned while the secret still holds an old
      # address. A failed keyscan is treated as "no server" rather than a
      # build failure, for the same reason as above.
      - name: Verify the server is reachable
        id: reachable
        if: steps.preflight.outputs.configured == 'true'
        env:
          UAT_HOST: ${{ secrets.UAT_HOST }}
        run: |
          mkdir -p ~/.ssh
          if ssh-keyscan -H "$UAT_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UAT_HOST is set but not reachable; skipping deploy."
          fi

      - name: Create inventory
        if: steps.reachable.outputs.reachable == 'true'
        run: |
          echo "${{ secrets.UAT_SSH_KEY }}" > ~/.ssh/uatserver
          chmod 600 ~/.ssh/uatserver
          cat > inventory.ini <<EOF
          [uat]
          ${{ secrets.UAT_HOST }} ansible_user=${{ secrets.UAT_USER }} ansible_ssh_private_key_file=~/.ssh/uatserver ansible_ssh_common_args='-o StrictHostKeyChecking=no'

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Create ansible.cfg
        if: steps.reachable.outputs.reachable == 'true'
        run: |
          cat > ansible.cfg <<EOF
          [defaults]
          host_key_checking = False
          EOF

      - name: Decrypt vault
        if: steps.reachable.outputs.reachable == 'true'
        run: echo "${{ secrets.VAULT_PASSWORD }}" > .vault_password

      - name: Substitute host placeholder
        if: steps.reachable.outputs.reachable == 'true'
        run: |
          UAT_HOST="${{ secrets.UAT_HOST }}.nip.io"
          find k8s/ argocd.yml -type f -exec sed -i "s/__UAT_HOST__/$UAT_HOST/g" {} +

      - name: Deploy with Ansible
        if: steps.reachable.outputs.reachable == 'true'
        run: ansible-playbook -i inventory.ini deploy.yml --vault-password-file .vault_password

      - name: Deploy K8s manifests to K3s
        if: steps.reachable.outputs.reachable == 'true'
        run: |
          rsync -avz -e "ssh -i ~/.ssh/uatserver -o StrictHostKeyChecking=no" \
            k8s/ ${{ secrets.UAT_USER }}@${{ secrets.UAT_HOST }}:/opt/myapp/k8s/
          ssh -i ~/.ssh/uatserver -o StrictHostKeyChecking=no \
            ${{ secrets.UAT_USER }}@${{ secrets.UAT_HOST }} \
            "k3s kubectl apply -f /opt/myapp/k8s/"

      - name: Report skip
        if: steps.reachable.outputs.reachable != 'true'
        run: |
          echo "Deploy skipped: no reachable UAT server configured." >> "$GITHUB_STEP_SUMMARY"
          echo "Lint and security scanning ran and passed; only the deploy step was skipped." >> "$GITHUB_STEP_SUMMARY"
